name: RAG Studio Tests

on:
  push:
    branches:
      - main
      - feature/rag-studio-v2.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile main_ui.py lib/kernel.py

      - name: Run test suite
        run: pytest -q
